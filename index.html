<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Ruang Game BPS</title>
    <meta name="description" content="Koleksi Game Santai Ruang Pelayanan Statistik Terpadu BPS" />
    <meta name="theme-color" content="#F1F5F9" />

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Font Preloads (Critical Latin Subsets) -->
    <link rel="preload" href="/fonts/Poppins-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Poppins-Bold.woff2" as="font" type="font/woff2" crossorigin />

    <style>
        /* Embedded Local Fonts */
        @font-face {
            font-family: 'Poppins';
            src: url('/fonts/Poppins-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Poppins';
            src: url('/fonts/Poppins-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        /* Pipeline Font Retro Pixel - Status: MENUNGGU FILE FONT DARI PEMILIK PROYEK */
        @font-face {
            font-family: 'Public Pixel';
            src: url('/fonts/PublicPixel.woff2') format('woff2'),
                 url('/fonts/PublicPixel.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html,
        body {
            width: 100%;
            min-width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #F1F5F9;
        }

        body {
            background-color: #F1F5F9;
            font-family: 'Public Pixel', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100svh;
            min-height: 100dvh;
            padding:
                env(safe-area-inset-top)
                env(safe-area-inset-right)
                env(safe-area-inset-bottom)
                env(safe-area-inset-left);
            touch-action: none;
            overscroll-behavior: none;
        }

        #game-root {
            position: relative;
            width: 100%;
            width: min(100vw, calc(100svh * 0.5625));
            width: min(100vw, calc(100dvh * 0.5625));
            height: 100%;
            height: min(100svh, calc(100vw * 1.7777778));
            height: min(100dvh, calc(100vw * 1.7777778));
            max-width: 100%;
            max-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
    </style>
</head>

<body>
    <main id="game-root" aria-label="Ruang Game BPS"></main>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
