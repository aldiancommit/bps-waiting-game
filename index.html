<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Game Ruang Tunggu BPS - 1010 Block Puzzle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700;900&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0a0e1a;
            background-image:
                radial-gradient(ellipse at 20% 10%, rgba(30, 60, 140, 0.35) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 90%, rgba(80, 20, 130, 0.25) 0%, transparent 55%);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        canvas {
            display: block;
            touch-action: none;
            border-radius: 20px;
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.06),
                0 20px 60px rgba(0, 0, 0, 0.7),
                0 0 80px rgba(20, 60, 180, 0.2);
        }
    </style>
</head>

<body>
    <script type="module" src="/main.js"></script>
</body>

</html>
