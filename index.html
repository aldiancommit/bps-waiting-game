<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Ruang Game BPS</title>
    <meta name="description" content="Koleksi Game Santai Ruang Pelayanan Statistik Terpadu BPS" />
    <meta name="theme-color" content="#EAF1FF" />
    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sar: env(safe-area-inset-right, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --app-h: 100vh;
        }

        @supports (height: 100svh) {
            :root {
                --app-h: 100svh;
            }
        }

        @supports (height: 100dvh) {
            :root {
                --app-h: 100dvh;
            }
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html,
        body {
            width: 100%;
            min-width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #EAF1FF;
        }

        body {
            min-height: 100vh;
            min-height: var(--app-h);
            height: var(--app-h);
            font-family: 'Poppins', 'Inter', system-ui, -apple-system, sans-serif;
            touch-action: none;
            overscroll-behavior: none;
        }

        #app-container {
            position: fixed;
            top: var(--sat);
            right: var(--sar);
            bottom: var(--sab);
            left: var(--sal);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #game-root {
            position: relative;
            width: min(calc(100vw - var(--sal) - var(--sar)), calc((var(--app-h) - var(--sat) - var(--sab)) * (9 / 16)));
            height: calc(min(calc(100vw - var(--sal) - var(--sar)), calc((var(--app-h) - var(--sat) - var(--sab)) * (9 / 16))) * (16 / 9));
            max-width: 100%;
            max-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            touch-action: none;
        }
    </style>
</head>

<body>
    <div id="app-container">
        <main id="game-root" aria-label="Ruang Game BPS"></main>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
